<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOtter — Panel Access</title>
    <link rel="stylesheet" href="/static/style/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">
                <!-- Heartbeat icon -->
                <svg viewBox="0 0 24 24">
                    <polyline points="2,12 6,12 8,6 10,18 12,10 14,14 16,12 22,12"/>
                </svg>
            </div>
            <h1>CareOtter</h1>
            <p>Medical Device Administration Panel</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-error" id="alert-error">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span class="alert-msg"></span>
        </div>
        <div class="alert alert-success" id="alert-success">
            <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
            <span class="alert-msg"></span>
        </div>

        <!-- Form -->
        <form id="login-form" class="login-form" autocomplete="off" novalidate>

            <div class="form-group">
                <label for="token-input">Administrator Token</label>
                <div class="input-wrapper">
                    <!-- Padlock icon -->
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input
                        type="password"
                        id="token-input"
                        name="token"
                        placeholder="Enter the access token"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="button" class="toggle-visibility" id="toggle-visibility" title="Show token">
                        <!-- Open eye -->
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <!-- Closed eye (hidden by default) -->
                        <svg class="eye-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                <span class="btn-text">Access Panel</span>
                <div class="spinner"></div>
            </button>

        </form>

        <!-- Info -->
        <div class="login-info">
            🏥 Restricted access to authorized technical personnel only.<br>
            The device must be connected to the same network.
        </div>

        <!-- Footer -->
        <div class="login-footer">
            CareOtter Admin API &nbsp;·&nbsp; VulnZoo IoT Security Lab
        </div>

    </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
