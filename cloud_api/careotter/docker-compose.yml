services:

  careotter-api:
    build:
      context: ./api_server
    container_name: careotter-api
    mem_limit: 256m
    cpus: 1.0
    environment:
      - VULNERABLE=1
      - DEVICE_IP=${DEVICE_IP:-192.168.2.1}
      - IGP_PORT=${IGP_PORT:-9999}
      - HTTP_PORT=${HTTP_PORT:-8081}
      - JWT_SECRET=${JWT_SECRET:-careotter_jwt_2026}
      - JWT_EXPIRATION_HOURS=8
      - PORT=5002
      - DB_PATH=/app/data/careotter.db
    volumes:
      # Volumen persistente para la base de datos SQLite
      - careotter_data:/app/data
    # Host networking: container shares the host network stack so the API
    # can read wlan0 IP directly and report it via /api/health.
    # Also allows routing to the device at 192.168.2.1 via eth0.
    network_mode: host
    restart: unless-stopped

volumes:
  careotter_data:
    driver: local
