# security_policy.yaml - Version 1.0 (Secure System)
ble:
  pairing_mode: "secure_passkey"  # Options: "just_works", "passkey", "oob"
  encryption_required: true       # false = clear transmission
  bonding: "secure"               # "none", "temporary", "secure"
  authentication_timeout: 30      # Seconds to authenticate dangerous command
  
api:
  tls_version: "1.3"
  certificate_pinning: true
  authentication: "oauth2_pkce"
  rate_limiting: true
  
data:
  encryption_at_rest: "aes256"
  pii_masking: true               # Mask SSN/names in logs
  retention_days: 30

alerts:
  require_ack: true               # Critical alerts require ACK from patient/guardian
  escalation_delay: 60            # Seconds before escalating to guardian