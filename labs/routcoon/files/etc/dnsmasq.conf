# Change the following lines if you want dnsmasq to serve SRV
# records.
# You may add multiple srv-host lines.
# The fields are <name>,<target>,<port>,<priority>,<weight>

# A SRV record sending LDAP for the example.com domain to
# ldapserver.example.com port 289
#srv-host=_ldap._tcp.example.com,ldapserver.example.com,389

# Two SRV records for LDAP, each with different priorities
#srv-host=_ldap._tcp.example.com,ldapserver.example.com,389,1
#srv-host=_ldap._tcp.example.com,ldapserver.example.com,389,2

# A SRV record indicating that there is no LDAP server for the domain
# example.com
#srv-host=_ldap._tcp.example.com

# The following line shows how to make dnsmasq serve an arbitrary PTR
# record. This is useful for DNS-SD.
# The fields are <name>,<target>
#ptr-record=_http._tcp.dns-sd-services,"New Employee Page._http._tcp.dns-sd-services"

# Change the following lines to enable dnsmasq to serve TXT records.
# These are used for things like SPF and zeroconf.
# The fields are <name>,<text>,<text>...

#Example SPF.
#txt-record=example.com,"v=spf1 a -all"

#Example zeroconf
#txt-record=_http._tcp.example.com,name=value,paper=A4

# Provide an alias for a "local" DNS name. Note that this _only_ works
# for targets which are names from DHCP or /etc/hosts. Give host
# "bert" another name, bertrand
# The fields are <cname>,<target>
#cname=bertand,bert

# Configuración DNS insegura
domain-needed
bogus-priv
expand-hosts
local=/lan/
domain=lan

# Cache DNS excesiva (vulnerable a poisoning)
cache-size=10000
no-negcache

# Sin protección contra rebind attacks
#stop-dns-rebind                      # COMENTADO: Permite DNS rebinding
#rebind-localhost-ok                  # COMENTADO: Permite rebind a localhost
#rebind-domain-ok=/                   # COMENTADO: Permite rebind a cualquier dominio

# DHCP configurado de forma insegura
# Escucha en TODAS las interfaces (incluyendo WAN si está configurado)
interface=br-lan
interface=eth0
interface=wlan0
bind-interfaces

# Rango DHCP sin restricciones
dhcp-range=192.168.1.100,192.168.1.254,255.255.255.0,12h
dhcp-option=3,192.168.1.1            # Gateway
dhcp-option=6,8.8.8.8,8.8.4.4        # DNS servers

# Configuraciones peligrosas para laboratorio
dhcp-authoritative                    # Se declara como servidor autoritativo
dhcp-lease-max=100000                # Demasiados leases posibles (DoS potencial)
read-ethers                          # Lee /etc/ethers (archivo modificable)
dhcp-ignore=tag:!known               # Ignora solo clientes desconocidos

# Archivos en ubicaciones inseguras
dhcp-leasefile=/tmp/dhcp.leases      # ¡En /tmp! Cualquiera puede modificarlo
dhcp-hostsfile=/tmp/hosts            # Archivo de hosts en /tmp

# Script de ejecución peligroso (ejecutado como root)
dhcp-script=/etc/dnsmasq.script

# Logging mínimo para ocultar actividad
log-queries
log-dhcp
log-facility=/var/log/dnsmasq.log
log-async=50

# Sin rate limiting (vulnerable a flood attacks)
#dhcp-rapid-commit                   # COMENTADO: Sin protección contra flood

# Opciones adicionales inseguras
#local-service                       # COMENTADO: Responde a consultas locales
#no-resolv                           # COMENTADO: No usa /etc/resolv.conf
#server=8.8.8.8                      # Servidor DNS upstream
#server=8.8.4.4

# Configuraciones específicas para IPv6 (si está habilitado)
#dhcp-range=::100,::1ff,constructor:br-lan,ra-names,12h
#enable-ra
#dhcp-option=option6:dns-server,[::]