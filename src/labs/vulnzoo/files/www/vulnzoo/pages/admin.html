<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VulnZoo — Administration Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../assets/images/vulnzoo.ico">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div id="navbar">
    <div id="logo">
      <a href="../index.html" style="text-decoration:none; display:flex; align-items:center; gap:14px;">
        <img src="../assets/images/vulnzoo.jpeg" alt="VulnZoo Logo">
        <h1>VulnZoo</h1>
      </a>
    </div>
    <div id="nav-menus">
      <a href="../index.html" class="nav-link">Overview</a>
      <a href="devices.html" class="nav-link">Devices</a>
      <a href="admin.html" class="nav-link" aria-current="page">Admin</a>
      <a href="https://github.com/DEKRA-Cybersecurity/VulnZoo" class="nav-link" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>

  <div class="main-content">
    <div class="page-wrap">
      <div class="page-head">
        <div>
          <div class="eyebrow">vulnzoo / admin</div>
          <h2>Administration</h2>
        </div>
      </div>

      <div id="current-device">
        <h2>
          <span class="label">Current device</span>
          <span id="active-device">None</span>
        </h2>
        <span id="device-status" class="status stopped">Stopped</span>
      </div>

      <div id="admin-panel">
        <h2>Controls</h2>
        <div class="btn-row">
          <button class="btn btn-danger" onclick="stopCurrentDevice()">Stop current device</button>
          <button class="btn" onclick="restartServices()">Restart services</button>
          <button class="btn" onclick="showLogs()">View logs</button>
          <div id="device-link-container" style="display:inline-flex; gap:10px;"></div>
        </div>
      </div>

      <div id="logs" style="display:none;">
        <h3>System logs</h3>
        <textarea id="log-content" rows="15" cols="80" readonly="readonly"></textarea>
      </div>
    </div>
  </div>

  <footer>
    <p><a href="https://github.com/VulnZoo/VulnZoo" target="_blank" rel="noopener">VulnZoo Project © 2025 · github.com/VulnZoo</a></p>
  </footer>

  <script src="../assets/js/vulnzoo.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
