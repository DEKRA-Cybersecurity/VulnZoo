<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOtter — My Profile</title>
    <link rel="stylesheet" href="/static/style/index.css">
    <link rel="stylesheet" href="/static/style/profile.css">
</head>
<body>

<!-- Header -->
<nav class="header">
    <div class="header-brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><polyline points="2,12 6,12 8,6 10,18 12,10 14,14 16,12 22,12"/></svg>
        </div>
        <div class="brand-text">
            <span class="brand-title">CareOtter</span>
            <span class="brand-subtitle">Account Settings</span>
        </div>
    </div>
    <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" title="Toggle dark mode">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <a href="/" class="btn btn-secondary btn-sm">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
            Monitor
        </a>
        <button id="btn-logout" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>
</nav>

<main class="main-content">

    <div class="page-header">
        <h1>My Profile</h1>
        <p>Manage your photo, display name, username and password</p>
    </div>

    <!-- Identity card -->
    <section class="profile-section">
        <div class="card profile-identity">
            <div class="avatar-wrap">
                <img id="avatar-img" class="avatar" alt="Profile photo"
                     src="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'&gt;&lt;path d='M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-8 2-8 6v2h16v-2c0-4-4-6-8-6Z'/&gt;&lt;/svg&gt;">
                <label for="avatar-input" class="avatar-edit" title="Change photo">
                    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </label>
                <input id="avatar-input" type="file" accept="image/*" hidden>
            </div>
            <div class="identity-meta">
                <h2 id="identity-name">—</h2>
                <span class="identity-username">@<span id="identity-username">—</span></span>
                <span class="role-pill" id="identity-role">patient</span>
                <p class="identity-since">Member since <span id="identity-since">—</span></p>
            </div>
        </div>
    </section>

    <!-- Display name -->
    <section class="profile-section">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Display Name
                </h3>
            </div>
            <div class="form-body">
                <label for="display-name-input">Shown across the patient portal</label>
                <div class="inline-form">
                    <input id="display-name-input" type="text" maxlength="60" placeholder="e.g. Jane Doe">
                    <button id="btn-save-display" class="btn btn-primary">Save</button>
                </div>
                <p class="form-msg" id="display-msg"></p>
            </div>
        </div>
    </section>

    <!-- Change username -->
    <section class="profile-section">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Username
                </h3>
            </div>
            <div class="form-body">
                <label for="username-input">Your login name (min 3 characters)</label>
                <div class="inline-form">
                    <input id="username-input" type="text" minlength="3" maxlength="40" placeholder="new_username">
                    <button id="btn-save-username" class="btn btn-primary">Change</button>
                </div>
                <p class="form-hint">Changing this updates your login credentials. You'll stay signed in.</p>
                <p class="form-msg" id="username-msg"></p>
            </div>
        </div>
    </section>

    <!-- Change password -->
    <section class="profile-section">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Password
                </h3>
            </div>
            <div class="form-body">
                <label for="current-pw-input">Current password</label>
                <input id="current-pw-input" type="password" placeholder="••••••••" autocomplete="current-password">
                <label for="new-pw-input">New password (min 6 characters)</label>
                <input id="new-pw-input" type="password" placeholder="••••••••" autocomplete="new-password">
                <label for="confirm-pw-input">Confirm new password</label>
                <input id="confirm-pw-input" type="password" placeholder="••••••••" autocomplete="new-password">
                <button id="btn-save-password" class="btn btn-primary" style="margin-top: 0.75rem;">Update Password</button>
                <p class="form-msg" id="password-msg"></p>
            </div>
        </div>
    </section>

</main>

<footer class="footer">
    <p>CareOtter Medical Device Monitor</p>
</footer>

<script src="/static/js/profile.js"></script>
</body>
</html>
