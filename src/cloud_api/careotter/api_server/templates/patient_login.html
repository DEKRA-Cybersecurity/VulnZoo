<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOtter — Patient Portal</title>
    <link rel="stylesheet" href="/static/style/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            <div class="logo-icon">
                <!-- Heartbeat icon -->
                <svg viewBox="0 0 24 24">
                    <polyline points="2,12 6,12 8,6 10,18 12,10 14,14 16,12 22,12"/>
                </svg>
            </div>
            <h1>CareOtter</h1>
            <p>Patient Monitoring Portal</p>
        </div>

        <!-- Alerts -->
        <div class="alert alert-error" id="alert-error">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span class="alert-msg"></span>
        </div>
        <div class="alert alert-success" id="alert-success">
            <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
            <span class="alert-msg"></span>
        </div>

        <!-- Form -->
        <form id="login-form" class="login-form" autocomplete="off" novalidate>

            <div class="form-group">
                <label for="username-input">Username</label>
                <div class="input-wrapper">
                    <!-- User icon -->
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input
                        type="text"
                        id="username-input"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password-input">Password</label>
                <div class="input-wrapper">
                    <!-- Padlock icon -->
                    <svg class="input-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input
                        type="password"
                        id="password-input"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="button" class="toggle-visibility" id="toggle-visibility" title="Show password">
                        <!-- Open eye -->
                        <svg class="eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <!-- Closed eye (hidden by default) -->
                        <svg class="eye-closed" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
                <span class="btn-text">Log In</span>
                <div class="spinner"></div>
            </button>

        </form>

        <!-- Account recovery -->
        <div class="forgot-links">
            <button type="button" class="link-btn" id="forgot-username">Forgot username?</button>
            <button type="button" class="link-btn" id="forgot-password">Forgot password?</button>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            CareOtter Patient Portal &nbsp;·&nbsp; VulnZoo IoT Security Lab
        </div>

    </div>
</div>

<!-- Recovery modal — used by both Forgot username / Forgot password flows.
     VULN=1 INTENTIONAL: leaks credentials of the seeded patient account so
     the lab is self-discoverable without external hints. -->
<div class="recovery-overlay" id="recovery-overlay" hidden>
    <div class="recovery-modal" role="dialog" aria-modal="true" aria-labelledby="recovery-title">
        <h3 id="recovery-title">Account Recovery</h3>
        <p id="recovery-body">…</p>
        <div class="recovery-actions" id="recovery-actions">
            <button type="button" class="btn-secondary" id="recovery-cancel">Cancel</button>
            <button type="button" class="btn-primary"   id="recovery-accept">Accept</button>
        </div>
    </div>
</div>

<script src="/static/js/patient_login.js"></script>
</body>
</html>
