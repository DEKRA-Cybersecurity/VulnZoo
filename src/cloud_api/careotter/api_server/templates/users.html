<main class="page-content">

    <div class="page-header">
        <h2>User Administration</h2>
        <p>Manage all system users — currently: delete an account.</p>
    </div>

    <div class="card">
        <div class="card-header">
            <span class="card-title">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="23" y2="8"/></svg>
                Delete User
            </span>
        </div>

        <div class="form-grid">
            <div class="form-group full">
                <label for="user-search">Username</label>
                <div class="user-search-wrap">
                    <input type="text" id="user-search" autocomplete="off" spellcheck="false"
                           placeholder="Type a username…">
                    <div class="user-suggest" id="user-suggest"></div>
                </div>
            </div>
        </div>

        <div style="margin-top:18px;display:flex;gap:12px;align-items:center">
            <button class="btn btn-danger" id="btn-delete-user">
                <svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Delete user
            </button>
        </div>

        <div class="alert-inline" id="delete-alert"></div>
    </div>

</main>

<script src="/static/js/panel.js"></script>
<script>
    // User Administration — autocomplete username search + delete.
    // Auth + active-nav marking are handled by panel.js (apiFetch attaches the Bearer token).
    (function () {
        const input   = document.getElementById('user-search');
        const suggest = document.getElementById('user-suggest');
        const alertEl = document.getElementById('delete-alert');
        let allUsers = [];          // [{username, role}]

        function showAlert(type, text) {
            alertEl.className = 'alert-inline show ' + type;
            alertEl.textContent = text;
        }
        function clearAlert() {
            alertEl.className = 'alert-inline';
            alertEl.textContent = '';
        }

        async function loadUsers() {
            try {
                const res  = await apiFetch('/api/users');
                const data = await res.json();
                allUsers = (data.users || []).map(u => ({ username: u.username, role: u.role }));
            } catch (e) {
                showAlert('error', 'Failed to load users.');
            }
        }

        function renderSuggest() {
            const q = input.value.trim().toLowerCase();
            suggest.innerHTML = '';
            if (!q) { suggest.className = 'user-suggest'; return; }

            const matches = allUsers
                .filter(u => u.username.toLowerCase().includes(q))      // substring match
                .sort((a, b) => a.username.localeCompare(b.username))   // alphabetical
                .slice(0, 50);

            if (!matches.length) {
                const empty = document.createElement('div');
                empty.className = 'user-suggest-empty';
                empty.textContent = 'No matching users';
                suggest.appendChild(empty);
            } else {
                matches.forEach(u => {
                    const item = document.createElement('div');
                    item.className = 'user-suggest-item';
                    item.dataset.username = u.username;
                    const name = document.createElement('span');
                    name.textContent = u.username;                     // textContent → XSS-safe
                    const role = document.createElement('span');
                    role.className = 'u-role';
                    role.textContent = u.role || '';
                    item.append(name, role);
                    suggest.appendChild(item);
                });
            }
            suggest.className = 'user-suggest show';
        }

        input.addEventListener('input', () => { clearAlert(); renderSuggest(); });

        suggest.addEventListener('click', (e) => {
            const item = e.target.closest('.user-suggest-item');
            if (!item) return;
            input.value = item.dataset.username;
            suggest.className = 'user-suggest';
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-search-wrap')) suggest.className = 'user-suggest';
        });

        document.getElementById('btn-delete-user').addEventListener('click', async () => {
            const username = input.value.trim();
            if (!username) { showAlert('error', 'Enter a username to delete.'); return; }
            if (!window.confirm('Delete user "' + username + '"? This cannot be undone.')) return;
            try {
                const res = await apiFetch('/api/users/delete', {
                    method: 'POST',
                    body: JSON.stringify({ username })
                });
                const d = await res.json().catch(() => ({}));
                if (res.ok && d.ok) {
                    showAlert('success', 'Deleted user: ' + d.deleted);
                    allUsers = allUsers.filter(u => u.username !== username);
                    input.value = '';
                    suggest.className = 'user-suggest';
                } else {
                    showAlert('error', d.error ? ('Failed: ' + d.error) : 'User not found or not deleted.');
                }
            } catch (e) {
                showAlert('error', 'Network error.');
            }
        });

        loadUsers();
    })();
</script>
</body>
</html>
