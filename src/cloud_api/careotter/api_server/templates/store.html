<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOtter — Health Store</title>
    <link rel="stylesheet" href="/static/style/index.css">
    <link rel="stylesheet" href="/static/style/store.css">
</head>
<body>

<!-- Header -->
<nav class="header">
    <div class="header-brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><polyline points="2,12 6,12 8,6 10,18 12,10 14,14 16,12 22,12"/></svg>
        </div>
        <div class="brand-text">
            <span class="brand-title">CareOtter</span>
            <span class="brand-subtitle">Health Store</span>
        </div>
    </div>
    <div class="header-actions">
        <div class="device-badge" title="Wallet balance">
            <svg viewBox="0 0 24 24"><path d="M21 4H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M1 10h22"/></svg>
            <span id="wallet-balance-badge">—</span>
        </div>
        <a href="/" class="btn-icon" title="Back to monitor">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        </a>
        <a href="/appointments" id="btn-appointments" class="btn-icon" title="Appointments">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </a>
        <a href="/diagnostics" id="btn-diagnostics" class="btn-icon" title="Device Diagnostics">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
        </a>
        <a href="/profile" class="btn-icon" title="My profile &amp; account settings">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <button id="theme-toggle" class="btn-icon" title="Toggle dark mode">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button id="btn-logout" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>
</nav>

<main class="main-content">

    <!-- Wallet -->
    <section class="store-section">
        <div class="card wallet-card">
            <div class="wallet-info">
                <div class="wallet-icon">
                    <svg viewBox="0 0 24 24"><path d="M21 4H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="M16 12h.01"/></svg>
                </div>
                <div>
                    <div class="wallet-label">Wallet balance</div>
                    <div class="wallet-balance"><span id="wallet-balance">—</span></div>
                    <div class="wallet-sub">Fixed device-procurement budget — no top-up. Spend it on the catalog below.</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Catalog -->
    <section class="store-section">
        <h2 class="section-title">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Health Store
        </h2>
        <p id="catalog-msg" class="store-msg" style="display:none;"></p>
        <div id="product-grid" class="product-grid">
            <p style="color: var(--text-secondary);">Loading products…</p>
        </div>
    </section>

    <!-- Orders -->
    <section class="store-section">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    My Orders
                </h3>
            </div>
            <div id="orders-list" style="padding: 1rem;">
                <p style="color: var(--text-secondary); font-size: 0.875rem;">No orders yet.</p>
            </div>
        </div>
    </section>

</main>

<footer class="footer">
    <p>CareOtter Health Store</p>
</footer>

<script src="/static/js/store.js"></script>
</body>
</html>
