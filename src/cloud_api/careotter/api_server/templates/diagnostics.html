<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareOtter — Device Diagnostics</title>
    <link rel="stylesheet" href="/static/style/index.css">
    <link rel="stylesheet" href="/static/style/diagnostics.css">
</head>
<!--
    Device Diagnostics: the cloud fetches the device's own /health endpoint server-side and
    shows the raw response. The device probe URL is validated against the registered-device
    whitelist. Privileged user-management API lives under /api/users/* (loopback only).
-->
<body>

<!-- Header -->
<nav class="header">
    <div class="header-brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24"><polyline points="2,12 6,12 8,6 10,18 12,10 14,14 16,12 22,12"/></svg>
        </div>
        <div class="brand-text">
            <span class="brand-title">CareOtter</span>
            <span class="brand-subtitle">Device Diagnostics</span>
        </div>
    </div>
    <div class="header-actions">
        <a href="/" class="btn-icon" title="Back to monitor">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        </a>
        <a href="/store" class="btn-icon" title="Health Store">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </a>
        <a href="/appointments" class="btn-icon" title="Appointments">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </a>
        <a href="/profile" class="btn-icon" title="My profile &amp; account settings">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <button id="theme-toggle" class="btn-icon" title="Toggle dark mode">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button id="btn-logout" class="btn btn-ghost btn-sm">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>
</nav>

<main class="main-content">

    <section class="diag-section">
        <h2 class="section-title">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></svg>
            Device Connectivity &amp; Diagnostics
        </h2>
        <p class="diag-help">
            The cloud will fetch your device's diagnostics endpoint and show the raw response.
            Only registered device hosts are allowed.
        </p>

        <div class="card diag-card">
            <label class="diag-label" for="probe-url">Device diagnostics URL</label>
            <div class="diag-row">
                <input type="text" id="probe-url" class="diag-input"
                       value="http://careservice:8081/health"
                       spellcheck="false" autocomplete="off">
                <button id="btn-probe" class="btn btn-primary">Check diagnostics</button>
            </div>
            <p id="diag-msg" class="diag-msg" style="display:none;"></p>
        </div>

        <div class="card diag-result" id="diag-result" style="display:none;">
            <div class="diag-result-head">
                <span class="diag-result-title">Upstream response</span>
                <span id="diag-status" class="diag-status">—</span>
            </div>
            <pre id="diag-body" class="diag-body"></pre>
        </div>
    </section>

</main>

<footer class="footer">
    <p>CareOtter Device Diagnostics</p>
</footer>

<script src="/static/js/diagnostics.js"></script>
</body>
</html>
