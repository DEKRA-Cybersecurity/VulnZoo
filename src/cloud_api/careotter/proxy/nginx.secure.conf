# CareOtter reverse proxy — SECURE config (VULNERABLE=0).
#
# The secure variant keeps ONLY the hardened auth host and DECOMMISSIONS the
# forgotten one — the real API9 remediation (inventory and remove the host, not
# "remember to add the limit to it later"):
#
#   api.careotter.lab        — served. Normalized API8 ACL, nginx limit_req on
#                              /verify, and X-OTP-Guard:on so the app enforces the
#                              per-account attempt cap (lockout). Also default_server.
#   beta.api.careotter.lab   — returns 404 (taken down). There is no precarious
#                              path to pivot to, so the OTP is not brute-forceable.
#
# Defense-in-depth note: a path-string proxy ACL and a per-edge rate-limit are both
# the WRONG boundary on their own. The app-level attempt cap (X-OTP-Guard) is the
# control that survives reloads/IP changes. This config flips the lab to the closed
# state — see the API9 doc's "How It Should Be".

limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;
limit_req_status 429;

# ── SECURE host: api.careotter.lab (+ default for any other Host) ──────────────
server {
    listen 80 default_server;
    listen 5002 default_server;
    server_name api.careotter.lab;

    # Regex/prefix matching — covers the trailing-slash variant.
    location ~ ^/admin/            { return 403; }
    location ~ ^/api/db/           { return 403; }
    location ~ ^/initialize_iot/?$ { return 403; }

    location ~ ^/api/auth/password-reset/verify {
        limit_req zone=otp burst=2 nodelay;
        proxy_pass http://careotter-api:5002;
        proxy_set_header X-OTP-Guard       on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://careotter-api:5002;
        proxy_set_header X-OTP-Guard       on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Decommissioned beta host: beta.api.careotter.lab → 404 ─────────────────────
# Explicit 404 (not omitted) so a request carrying Host: beta.api.careotter.lab does
# NOT fall through to the default_server (api.) and reach a no-cap path. The host is
# simply gone.
server {
    listen 80;
    listen 5002;
    server_name beta.api.careotter.lab;
    return 404;
}
