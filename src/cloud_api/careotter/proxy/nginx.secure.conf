# CareOtter reverse proxy — SECURE config (VULNERABLE=0).
#
# Normalized prefix/regex matching that covers path-equivalent variants, so the
# trailing-slash bypass is closed: canonical AND "<path>/" both return 403.
#
#   GET /api/db/info     -> 403
#   GET /api/db/info/    -> 403   (regex prefix still matches)
#
# Defense-in-depth note: a path-string ACL at the proxy is the WRONG security
# boundary. The real fix is app-level authentication on /api/db/*, /initialize_iot
# and /admin/* — not "the request arrived through the trusted proxy". This config
# only flips the lab toggle to the closed state.
server {
    listen 5002;
    server_name _;

    # Regex/prefix matching — evaluated before `location /`, covers every variant.
    location ~ ^/admin/            { return 403; }
    location ~ ^/api/db/           { return 403; }
    location ~ ^/initialize_iot/?$ { return 403; }

    location / {
        proxy_pass http://careotter-api:5002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
