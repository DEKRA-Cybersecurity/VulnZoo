# CareOtter reverse proxy — VULNERABLE config (API8:2023 Security Misconfiguration).
#
# The admin panel (/admin/*), DB-debug endpoints (/api/db/*) and the lab-init route
# (/initialize_iot) are meant to be internal-only. This ACL "hardens" them by
# enumerating the sensitive URLs with EXACT-match `location =` rules.
#
# THE BUG (CWE-436 Interpretation Conflict): nginx exact-match is literal, but the
# Flask app routes slash-INSENSITIVELY (app.url_map.strict_slashes = False). The
# proxy and the WSGI app therefore disagree on the canonical path form, so appending
# a trailing slash slips past the `deny` yet still reaches the handler:
#
#   GET /api/db/info     -> 403 (nginx exact-match denies)
#   GET /api/db/info/    -> 200 (nginx exact-match misses; gunicorn/werkzeug routes
#                                 "/api/db/info/" to the "/api/db/info" handler)
#
# Socket-verified (nginx 1.30.1 + werkzeug 3.1.5) across the whole bundle.
server {
    listen 5002;
    server_name _;

    # "Internal-only" sensitive surface — enumerated exact paths (the brittle ACL).
    location = /admin/dashboard { return 403; }
    location = /admin/network   { return 403; }
    location = /admin/config    { return 403; }
    location = /admin/services  { return 403; }
    location = /admin/logs      { return 403; }
    location = /admin/users     { return 403; }
    location = /api/db/info     { return 403; }
    location = /api/db/test     { return 403; }
    location = /initialize_iot  { return 403; }

    # Everything else is proxied to the (now internal-only) API container.
    location / {
        proxy_pass http://careotter-api:5002;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
