# CareOtter reverse proxy — VULNERABLE config.
#
# One edge, two name-based virtual hosts in front of the SAME careotter-api. The
# subdomain in the Host header selects which OTP-auth mechanism applies — exactly
# the OWASP API9 shape (api.* vs beta.api.*):
#
#   api.careotter.lab        — SECURE mechanism. nginx limit_req on /verify AND the
#                              app-level per-account attempt cap (via X-OTP-Guard).
#   beta.api.careotter.lab   — PRECARIOUS / forgotten host. NO limit_req and the
#                              guard header is cleared, so the app skips the cap too
#                              → the 6-digit OTP is brute-forceable by name (API9).
#
# X-OTP-Guard is a TRUSTED request header: nginx overwrites any client-supplied
# copy, so the app can rely on it to tell the two mechanisms apart (not the
# attacker-controlled Host). In secure mode the beta vhost is decommissioned (404).
#
# Both names resolve to this host via /etc/hosts (or any DNS). api.careotter.lab is
# the default_server, so any other Host (localhost:5002, the Android app, the Pi
# cloud_set) keeps hitting the secure host.
#
# API8 (Security Misconfiguration) is preserved on BOTH vhosts: the exact-match ACL
# disagrees with the slash-insensitive app, so GET /api/db/info/ -> 200 still bypasses.

# API9 rate-limit zone (http scope). Referenced ONLY by the production vhost here.
limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;
limit_req_status 429;

# ── Production / SECURE host: api.careotter.lab (+ default for any other Host) ──
server {
    listen 80 default_server;
    listen 5002 default_server;
    server_name api.careotter.lab;

    # "Internal-only" sensitive surface — enumerated exact paths (the brittle ACL).
    location = /admin/dashboard { return 403; }
    location = /admin/network   { return 403; }
    location = /admin/config    { return 403; }
    location = /admin/services  { return 403; }
    location = /admin/logs      { return 403; }
    location = /admin/users     { return 403; }
    location = /api/db/info     { return 403; }
    location = /api/db/test     { return 403; }
    location = /initialize_iot  { return 403; }

    # Throttle the OTP verify (edge) AND mark the request as guarded so the app
    # enforces the per-account attempt cap. Regex so "/verify" and "/verify/" match.
    location ~ ^/api/auth/password-reset/verify {
        limit_req zone=otp burst=2 nodelay;
        proxy_pass http://careotter-api:5002;
        proxy_set_header X-OTP-Guard       on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://careotter-api:5002;
        proxy_set_header X-OTP-Guard       on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Forgotten / PRECARIOUS host: beta.api.careotter.lab ────────────────────────
# Identical to production EXCEPT there is NO limit_req on /verify AND the guard
# header is CLEARED, so the app skips the attempt cap. THE BUG is the absence of
# BOTH protections — the 6-digit OTP is brute-forceable here. Served only in
# VULNERABLE mode (the secure config returns 404 for this name).
server {
    listen 80;
    listen 5002;
    server_name beta.api.careotter.lab;

    # Same API8 ACL as production — "the same API", so only the OTP protections differ.
    location = /admin/dashboard { return 403; }
    location = /admin/network   { return 403; }
    location = /admin/config    { return 403; }
    location = /admin/services  { return 403; }
    location = /admin/logs      { return 403; }
    location = /admin/users     { return 403; }
    location = /api/db/info     { return 403; }
    location = /api/db/test     { return 403; }
    location = /initialize_iot  { return 403; }

    # NO limit_req on /verify (it falls through to `location /`), and X-OTP-Guard is
    # cleared so the app does not count or check the attempt cap → brute-forceable.
    location / {
        proxy_pass http://careotter-api:5002;
        proxy_set_header X-OTP-Guard       "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
