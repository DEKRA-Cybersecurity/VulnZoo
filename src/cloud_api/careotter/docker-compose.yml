services:

  # ── Reverse proxy — one edge, two name-based vhosts (API8 + API9) ────────────
  # Publishes :80 (clean no-port URLs) and :5002 (legacy: the patient portal, the
  # Android app and the Pi cloud_set all use :5002). Two server_name vhosts front
  # the SAME internal careotter-api:
  #   api.careotter.lab      — production: API8 ACL + OTP rate-limit (also default,
  #                            so localhost:5002 / unknown Host hits the safe host).
  #   beta.api.careotter.lab — the forgotten host: identical EXCEPT it omits the
  #                            OTP rate-limit, so the 6-digit code is brute-forceable
  #                            BY NAME (API9). VULNERABLE=0 restores the limit on it.
  # The subdomain in the Host header decides — exactly the OWASP api./beta.api. shape.
  # Map both names to this host via /etc/hosts (cloudctl prints the line).
  careotter-proxy:
    build:
      context: ./proxy
    container_name: careotter-proxy
    environment:
      - VULNERABLE=${VULNERABLE:-1}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:5002:5002"
    networks:
      - careotter-net
    restart: unless-stopped
    depends_on:
      - careotter-api

  careotter-api:
    build:
      context: ./api_server
    container_name: careotter-api
    mem_limit: 256m
    cpus: 1.0
    environment:
      - VULNERABLE=${VULNERABLE:-1}
      - DEVICE_IP=${DEVICE_IP:-}
      - IGP_PORT=${IGP_PORT:-9999}
      - HTTP_PORT=${HTTP_PORT:-8081}
      - JWT_SECRET=${JWT_SECRET:-careotter_jwt_2026}
      - JWT_EXPIRATION_HOURS=8
      - PORT=5002
      - DB_PATH=/app/data/careotter.db
      - WIFI_SSID=${WIFI_SSID:-}
      - WIFI_PSK=${WIFI_PSK:-}
      - HOST_WIFI_IP=${HOST_WIFI_IP:-}
    volumes:
      - careotter_data:/app/data
    # No published ports — the API is reachable only on the internal careotter-net
    # (at careotter-api:5002). The careotter-proxy in front owns the external :5002.
    networks:
      - careotter-net
    restart: unless-stopped
    depends_on:
      - careservice-alice
      - careservice-bob

  # ── Virtual CareOtter devices (identical careservice.c binary) ───────────────
  # Each container runs the native x86_64 build of careservice.c with OpenWRT
  # runtime stubs. They are reachable from the Cloud API over the internal
  # Docker network at careservice-alice:9999 and careservice-bob:9999.
  # These devices share the same hardcoded signature and vulnerabilities as
  # the real Pi, enabling lateral-movement and multi-target attack scenarios.

  careservice-alice:
    build:
      context: ../..
      dockerfile: cloud_api/careotter/careservice/Dockerfile
    container_name: careservice-alice
    networks:
      careotter-net:
        aliases:
          - careservice-alice
    restart: unless-stopped

  careservice-bob:
    build:
      context: ../..
      dockerfile: cloud_api/careotter/careservice/Dockerfile
    container_name: careservice-bob
    networks:
      careotter-net:
        aliases:
          - careservice-bob
    restart: unless-stopped

volumes:
  careotter_data:
    driver: local

networks:
  careotter-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
