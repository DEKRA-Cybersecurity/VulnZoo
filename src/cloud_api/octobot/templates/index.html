<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctoBot - Robot Arm Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo"><img src="{{ url_for('static', filename='octobot.png') }}" alt="OctoBot"><span>Octo<i>Bot</i></span></div>
      <span class="topbar-sub">Arm control</span>
      <span class="fw-badge" id="firmware-version">fw -</span>
    </div>
    <div class="topbar-right">
      <span class="api-status" id="api-status" data-state="init"><span class="dot"></span><span class="label">Connecting</span></span>
      <span class="topbar-user">{{ username }} · <a href="{{ url_for('logout') }}">Log out</a></span>
    </div>
  </header>

  <main class="workspace">
    <section>
      <div class="sec-h"><h2>Motors</h2><span>4 × SG90 · 0–180°</span></div>
      <div class="servos">
        <div class="servo-card" id="c1"><div class="servo-top"><span class="servo-name">Base</span><span class="servo-ch">M1</span></div>
          <svg class="gauge" viewBox="0 0 120 72"></svg><div class="servo-val" id="v1">-</div>
          <div class="slider-wrap"><input id="s1" type="range" min="65" max="135" aria-label="Base angle" oninput="onServo(1, this.value)"></div>
          <div class="servo-range"><span>65°</span><span>135°</span></div></div>
        <div class="servo-card" id="c2"><div class="servo-top"><span class="servo-name">Left</span><span class="servo-ch">M2</span></div>
          <svg class="gauge" viewBox="0 0 120 72"></svg><div class="servo-val" id="v2">-</div>
          <div class="slider-wrap"><input id="s2" type="range" min="80" max="140" aria-label="Left angle" oninput="onServo(2, this.value)"></div>
          <div class="servo-range"><span>80°</span><span>140°</span></div></div>
        <div class="servo-card" id="c3"><div class="servo-top"><span class="servo-name">Right</span><span class="servo-ch">M3</span></div>
          <svg class="gauge" viewBox="0 0 120 72"></svg><div class="servo-val" id="v3">-</div>
          <div class="slider-wrap"><input id="s3" type="range" min="70" max="120" aria-label="Right angle" oninput="onServo(3, this.value)"></div>
          <div class="servo-range"><span>70°</span><span>120°</span></div></div>
        <div class="servo-card" id="c4"><div class="servo-top"><span class="servo-name">Claw</span><span class="servo-ch">M4</span></div>
          <svg class="gauge" viewBox="0 0 120 72"></svg><div class="servo-val" id="v4">-</div>
          <div class="slider-wrap"><input id="s4" type="range" min="5" max="30" aria-label="Claw angle" oninput="onServo(4, this.value)"></div>
          <div class="servo-range"><span>5°</span><span>30°</span></div></div>
      </div>

      <div class="cmd-group">
        <button class="btn" onclick="cmd('record')">Record<small>save moves</small></button>
        <button class="btn" onclick="cmd('play')">Play<small>replay</small></button>
        <button class="btn" onclick="cmd('demo')">Demo<small>show off</small></button>
      </div>
      <button class="estop" onclick="cmd('stop')">EMERGENCY STOP</button>
      <div id="status" class="statusline"></div>
    </section>

    <aside class="orders">
      <div class="orders-head">
        <div class="orders-title"><h2>Orders</h2><small>Latest first</small></div>
        <div class="orders-actions">
          <button class="orders-clear" onclick="clearLog()">Clear</button>
          <button class="orders-toggle" id="ordersToggle" onclick="toggleOrders()" aria-label="Collapse orders" aria-expanded="true" title="Collapse / expand orders">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8 10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div id="log" class="orders-body"><div class="orders-empty" id="empty">No orders yet. Move a motor.</div></div>
    </aside>
  </main>

  <script>
    const SERVO_MAP = {base: 1, left: 2, right: 3, claw: 4};
    const NAMES = {1: 'Base', 2: 'Left', 3: 'Right', 4: 'Claw'};
    const CMD_LABEL = {record: 'Recording started', play: 'Playing recording', demo: 'Demo started', stop: 'Emergency stop'};
    const logEl = document.getElementById('log');
    const apiStatus = document.getElementById('api-status');
    function gotoLogin() { location.href = '/login'; }

    // --- gauges (semicircle, 0° left → 180° right) ---
    const pt = (a, r) => [(60 - r * Math.cos(a * Math.PI / 180)).toFixed(1), (62 - r * Math.sin(a * Math.PI / 180)).toFixed(1)];
    const arc = (a, b) => { const p = pt(a, 48), q = pt(b, 48); return 'M' + p.join(' ') + ' A48 48 0 0 1 ' + q.join(' '); };
    for (let n = 1; n <= 4; n++) {
      const i = document.getElementById('s' + n), min = +i.min, max = +i.max;
      const [x, y] = pt(90, 36), [lx, ly] = pt(0, 48), [rx, ry] = pt(180, 48);
      document.querySelector('#c' + n + ' .gauge').innerHTML =
        '<path class="track" d="' + arc(0, 180) + '"/><path class="range" d="' + arc(min, max) + '"/>' +
        '<text x="' + (lx - 3) + '" y="70">0</text><text x="' + (rx - 6) + '" y="70">180</text>' +
        '<line class="needle" id="n' + n + '" x1="60" y1="62" x2="' + x + '" y2="' + y + '"/><circle class="hub" cx="60" cy="62" r="5"/>';
    }

    // --- orders ---
    function addOrder(kind, label, detail, key) {
      document.getElementById('empty')?.remove();
      const t = new Date().toLocaleTimeString([], {hour12: false});
      // a slider drag fires many requests: update the same motor's top order in place
      const top = logEl.firstChild;
      if (key && top && top.dataset.key === key && Date.now() - top.dataset.ts < 1500) {
        top.querySelector('.ot').textContent = t; top.querySelector('.od').textContent = detail; top.dataset.ts = Date.now(); return;
      }
      const row = document.createElement('div');
      row.className = 'order fresh ' + kind; if (key) row.dataset.key = key; row.dataset.ts = Date.now();
      row.innerHTML = '<span class="ot"></span><span class="om"></span><span class="od"></span>';
      row.children[0].textContent = t; row.children[1].textContent = label; row.children[2].textContent = detail;
      logEl.prepend(row);
      while (logEl.childNodes.length > 100) logEl.removeChild(logEl.lastChild);
    }
    function clearLog() { logEl.innerHTML = '<div class="orders-empty" id="empty">No orders yet. Move a motor.</div>'; }

    function toggleOrders() {
      const collapsed = document.querySelector('.workspace').classList.toggle('collapsed');
      const btn = document.getElementById('ordersToggle');
      btn.setAttribute('aria-expanded', String(!collapsed));
      btn.setAttribute('aria-label', collapsed ? 'Expand orders' : 'Collapse orders');
    }

    function setApi(state, code) {
      apiStatus.dataset.state = state;
      const label = apiStatus.querySelector('.label');
      label.textContent = state === 'ok' ? 'Connected' : state === 'error' ? 'API error' + (code ? ' (' + code + ')' : '') : 'Connecting';
    }

    // order is written only once the request is accepted; failures become plain-language errors
    async function apiFetch(url, opts, onOk, failLabel) {
      try {
        const r = await fetch(url, opts);
        if (r.status === 401) { gotoLogin(); return r; }
        if (!r.ok) { setApi('error', r.status); addOrder('err', failLabel, 'failed ' + r.status); }
        else { setApi('ok'); onOk(); }
        return r;
      } catch (e) {
        setApi('error'); addOrder('err', failLabel, 'no connection'); throw e;
      }
    }

    function paint(n) {
      const input = document.getElementById('s' + n), v = Number(input.value);
      const pct = ((v - Number(input.min)) / (Number(input.max) - Number(input.min))) * 100;
      document.getElementById('c' + n).style.setProperty('--pct', pct + '%');
      input.parentNode.style.setProperty('--pct', pct + '%');
      document.getElementById('v' + n).textContent = v + '°';
      const [x, y] = pt(v, 36), l = document.getElementById('n' + n);
      l.setAttribute('x2', x); l.setAttribute('y2', y);
    }

    async function onServo(n, angle) {
      paint(n);
      await apiFetch('/api/servo/' + n, {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({angle: Number(angle)})
      }, () => addOrder('move', NAMES[n], angle + '°', 'm' + n), NAMES[n]);
    }

    async function cmd(name) {
      await apiFetch('/api/command/' + name, {method: 'POST'},
        () => addOrder(name === 'stop' ? 'stop' : 'cmd', CMD_LABEL[name] || name, name === 'stop' ? 'halted' : 'command'), CMD_LABEL[name] || name);
    }

    async function updateFirmwareVersion() {
      try {
        const r = await fetch('/api/v2/firmware/version');
        if (!r.ok) throw new Error(r.statusText);
        document.getElementById('firmware-version').textContent = 'fw ' + (await r.json()).version;
      } catch (e) { document.getElementById('firmware-version').textContent = 'fw unknown'; }
    }

    let lastOk = null;
    async function updateState() {
      try {
        const r = await fetch('/api/state');
        if (r.status === 401) { gotoLogin(); return; }
        if (!r.ok) throw new Error(r.status + ' ' + (r.statusText || 'ERROR'));
        const s = await r.json();
        const feedback = Array.isArray(s.feedback) && s.feedback.length >= 4 ? s.feedback : [s.base, s.left, s.right, s.claw];
        const idxMap = {base: 0, left: 1, right: 2, claw: 3};
        for (const [key, n] of Object.entries(SERVO_MAP)) {
          const val = feedback[idxMap[key]], slider = document.getElementById('s' + n);
          if (slider && val !== undefined && document.activeElement !== slider) { slider.value = val; paint(n); }
        }
        document.getElementById('status').textContent =
          'Updated ' + new Date().toLocaleTimeString([], {hour12: false}) + ' · command=' + s.command + ' · speed=' + s.speed + ' · status=' + s.status;
        setApi('ok');
        if (lastOk === false) addOrder('info', 'Connection restored', 'ok');
        lastOk = true;
      } catch (e) {
        setApi('error', (e.message.match(/^\d{3}/) || [''])[0]);
        document.getElementById('status').textContent = 'State update failed: ' + e.message;
        if (lastOk !== false) addOrder('err', 'Connection lost', 'retrying');
        lastOk = false;
      }
    }

    updateFirmwareVersion();
    updateState();
    setInterval(updateState, 1000);
  </script>
</body>
</html>
