<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OctoBot Cloud Controller</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .servo-row { margin: 24px 0; display: flex; align-items: center; gap: 15px; }
    .servo-row label { font-weight: bold; width: 80px; font-size: 1.2em; }
    .servo-row input[type=range] { width: 500px; height: 40px; }
    .servo-row .value { font-family: monospace; font-size: 1.6em; min-width: 60px; }
    button { font-size: 1.2em; padding: 10px 20px; margin: 5px; }
    #status { margin-top: 15px; color: #666; }
  </style>
</head>
<body>
  <h1>OctoBot Robot Arm Control</h1>
  <div class="servo-row">
    <label>Base:</label>
    <input id="s1" type="range" min="65" max="135" oninput="setServo(1, this.value)">
    <span class="value" id="v1">-</span>
  </div>
  <div class="servo-row">
    <label>Left:</label>
    <input id="s2" type="range" min="80" max="140" oninput="setServo(2, this.value)">
    <span class="value" id="v2">-</span>
  </div>
  <div class="servo-row">
    <label>Right:</label>
    <input id="s3" type="range" min="70" max="120" oninput="setServo(3, this.value)">
    <span class="value" id="v3">-</span>
  </div>
  <div class="servo-row">
    <label>Claw:</label>
    <input id="s4" type="range" min="5" max="30" oninput="setServo(4, this.value)">
    <span class="value" id="v4">-</span>
  </div>
  <button onclick="cmd('record')">Record</button>
  <button onclick="cmd('play')">Play</button>
  <button onclick="cmd('stop')">Stop</button>
  <button onclick="cmd('demo')">Demo</button>
  <div id="status"></div>

  <script>
    const SERVO_MAP = {base: 1, left: 2, right: 3, claw: 4};

    async function setServo(n, angle) {
      document.getElementById('v' + n).textContent = angle;
      await fetch(`/api/servo/${n}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({angle: Number(angle)})
      });
    }

    async function cmd(name) {
      await fetch(`/api/command/${name}`, {method: 'POST'});
    }

    async function updateState() {
      try {
        const r = await fetch('/api/state');
        if (!r.ok) throw new Error(r.statusText);
        const s = await r.json();
        // feedback[0..3] = actual base/left/right/claw angles reported by the firmware
        const feedback = Array.isArray(s.feedback) && s.feedback.length >= 4 ? s.feedback : [s.base, s.left, s.right, s.claw];
        const idxMap = {base: 0, left: 1, right: 2, claw: 3};
        for (const [key, n] of Object.entries(SERVO_MAP)) {
          const val = feedback[idxMap[key]];
          const slider = document.getElementById('s' + n);
          const display = document.getElementById('v' + n);
          if (slider && display && val !== undefined) {
            slider.value = val;
            display.textContent = val;
          }
        }
        document.getElementById('status').textContent =
          `Last update: ${new Date().toLocaleTimeString()} | command=${s.command} speed=${s.speed} status=${s.status}`;
      } catch (e) {
        document.getElementById('status').textContent = 'State update failed: ' + e.message;
      }
    }

    updateState();
    setInterval(updateState, 1000);
  </script>
</body>
</html>
