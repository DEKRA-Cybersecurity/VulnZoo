# BulbBee cloud emulator broker (BULB-A3).
# Plaintext :1883 is the lab default (the BULB-03 cleartext / replay substrate):
# an attacker on the path sees and replays the command topic. For the secure
# baseline (BULB-SEC) drop certs in ./certs and enable the TLS listener below.
listener 1883
allow_anonymous true
persistence false

# ponytail: the broker is anonymous in the lab; the session token (session_token.py)
# is the device authority the relay validates, not a broker ACL. Add a mosquitto
# auth plugin only if per-topic ACLs become part of the exercise.

# secure-mode TLS listener (BULB-SEC): needs ca.crt / server.crt / server.key
#listener 8883
#cafile /mosquitto/config/certs/ca.crt
#certfile /mosquitto/config/certs/server.crt
#keyfile /mosquitto/config/certs/server.key
#allow_anonymous true
