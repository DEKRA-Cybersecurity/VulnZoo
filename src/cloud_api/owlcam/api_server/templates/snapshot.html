<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <title>VulnZoo — Camera Live View</title>
    <link rel="stylesheet" href="/static/style/cameras.css">
    <link rel="stylesheet" href="/static/style/snapshot.css">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle dark mode">🌙 / ☀️</button>

    <div class="snapshot-container">
        <div class="snapshot-card player">

            <!-- ---------- Cabecera del reproductor ---------- -->
            <div class="player-header">
                <div class="player-title">
                    <span class="player-title-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7h3l1.6-2.2h6.8L16 7h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                            <circle cx="12" cy="13" r="3.4"/>
                        </svg>
                    </span>
                    <div class="player-title-text">
                        <h2>Security Camera</h2>
                        <p id="camera-label">RTSP live stream</p>
                    </div>
                </div>
                <div class="status" id="status">Connecting to the camera…</div>
            </div>

            <!-- ---------- Escena del reproductor ---------- -->
            <div class="player-stage" id="snapshot-wrapper">

                <div class="player-overlay top">
                    <div class="live-badge">
                        <span class="live-dot"></span>
                        <span class="live-text live-on">LIVE</span>
                        <span class="live-text live-off">STANDBY</span>
                    </div>
                    <div class="stream-meta">RTSP · Raspberry&nbsp;Pi</div>
                </div>

                <div id="loading-overlay" class="loading-overlay">
                    <div class="spinner"></div>
                    <p>Connecting to stream…</p>
                </div>

                <img id="snapshot" src="" alt="Camera Snapshot" style="display: none;" />

                <div id="error-message" class="error-message" style="display: none;"></div>

                <div class="player-overlay bottom">
                    <div class="stream-time">
                        <span class="rec-dot"></span>
                        <span id="stream-time">--:--:--</span>
                    </div>
                </div>
            </div>

            <!-- ---------- Barra de transporte ---------- -->
            <div class="player-toolbar controls">
                <div class="toolbar-group">
                    <button class="btn btn-auto" id="autoBtn" title="Toggle auto refresh">
                        <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
                        <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="5.5" width="3.2" height="13" rx="1"/><rect x="13.8" y="5.5" width="3.2" height="13" rx="1"/></svg>
                        <span class="btn-label">Auto Refresh</span>
                    </button>
                    <button class="btn btn-refresh" id="captureBtn" title="Capture a single frame">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M3 7h3l1.6-2.2h6.8L16 7h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                            <circle cx="12" cy="13" r="3.4"/>
                        </svg>
                        <span class="btn-label">Capture</span>
                    </button>
                    <button class="btn btn-stop" id="stopBtn" title="Stop auto refresh">
                        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
                        <span class="btn-label">Stop</span>
                    </button>
                </div>
                <div class="toolbar-group">
                    <button class="btn btn-back" id="backBtn" title="Back to cameras">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="12 5 6 12 12 19"/>
                            <line x1="6" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span class="btn-label">Back</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/js/snapshot.js"></script>
</body>
</html>
