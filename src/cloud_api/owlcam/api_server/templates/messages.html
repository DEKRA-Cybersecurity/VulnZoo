<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Messages Inbox - VulnZoo</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style/cameras.css">
    <link rel="stylesheet" href="/static/style/messages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="topbar">
        <div class="topbar-logo">
            <a href="/">
                <img src="/static/favicon.ico" alt="VulnZoo Logo" class="logo-img">
            </a>
        </div>
        <ul class="topbar-menu left">
            <li><a href="/cameras" id="cameras-link">Cameras</a></li>
            <li><a href="/support" id="support-link">Support</a></li>
            <li><a href="/messages" class="active">Messages</a></li>
        </ul>
        <div class="topbar-menu right">
            <div class="profile-dropdown">
                <button class="profile-btn" id="profile-dropdown-btn">👤 Profile ▼</button>
                <div class="profile-dropdown-content" id="profile-dropdown-content">
                    <a href="/profile" id="profile-link">Profile</a>
                    <a href="#" id="logout-link">Log Out</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="panel">
        <div class="header">
            <div>
                <h1>Messages</h1>
                <p class="subtitle">Internal messaging for your VulnZoo account</p>
            </div>
            <div class="header-actions">
                <button class="refresh-btn" onclick="loadMessages()">↻ Refresh</button>
                <button class="compose-btn" id="composeBtn" onclick="openCompose()">
                    <span class="plus">＋</span> Compose
                </button>
                <button id="theme-toggle" class="theme-toggle-btn" title="Toggle dark mode">🌙</button>
            </div>
        </div>

        <div id="errorContainer"></div>
        <div id="successContainer"></div>

        <div class="mail-layout">
            <!-- Panel de lista -->
            <section class="list-pane">
                <div class="list-head">
                    <div class="search-wrap">
                        <span class="search-icon">⌕</span>
                        <input type="text" id="searchInput" class="filter-input" placeholder="Search messages" oninput="filterMessages()" />
                    </div>
                    <div class="list-meta">
                        <span class="label">Inbox</span>
                        <span class="count" id="inboxCount">0 messages</span>
                    </div>
                </div>
                <div class="loading" id="loadingIndicator">Loading messages…</div>
                <div class="msg-list" id="messagesList" style="display:none;"></div>
            </section>

            <!-- Panel de detalle -->
            <section class="detail-pane">
                <!-- Estado vacío -->
                <div class="detail-empty" id="emptyState">
                    <div class="icon">✉</div>
                    <div class="big">Select a message to read</div>
                    <div class="small">Choose a conversation from the list on the left.</div>
                </div>

                <!-- Lector -->
                <div class="reader" id="readerPanel" style="display:none;">
                    <div class="reader-head">
                        <div class="reader-title" id="readerTitle"></div>
                        <div class="reader-from">
                            <div class="reader-avatar" id="readerAvatar"></div>
                            <div class="reader-sender" id="readerSender"></div>
                        </div>
                    </div>
                    <div class="reader-body" id="readerBody"></div>
                    <div class="reader-actions">
                        <button class="back-to-list-btn" onclick="closeMessage()">↩ Reply</button>
                        <button class="delete-current-btn" onclick="deleteCurrentMessage()">🗑 Delete</button>
                    </div>
                </div>

                <!-- Redacción -->
                <div class="send-message-section" id="sendMessageSection" style="display:none;">
                    <div class="compose-head">
                        <h2>New message</h2>
                        <button class="compose-close" onclick="closeCompose()">✕</button>
                    </div>
                    <form id="sendMessageForm" class="send-message-form">
                        <div>
                            <label class="field-label" for="recipientInput">Recipient</label>
                            <input type="text" id="recipientInput" placeholder="Recipient username" required />
                        </div>
                        <div>
                            <label class="field-label" for="subjectInput">Subject</label>
                            <input type="text" id="subjectInput" placeholder="Subject (optional)" maxlength="200" />
                        </div>
                        <div class="compose-body-field">
                            <label class="field-label" for="bodyInput">Message</label>
                            <textarea id="bodyInput" placeholder="Write your message…" rows="6" required maxlength="5000"></textarea>
                        </div>
                        <div id="sendMessageError" class="error" style="display:none;"></div>
                        <div id="sendMessageSuccess" class="success" style="display:none;"></div>
                    </form>
                    <div class="compose-actions">
                        <button type="submit" form="sendMessageForm" class="compose-send-btn">Send message</button>
                        <button type="button" class="compose-cancel-btn" onclick="closeCompose()">Discard</button>
                    </div>
                </div>
            </section>
        </div>

        <a href="/cameras" class="back-link">← Back to Cameras</a>
    </div>

    <script src="/static/js/messages.js"></script>
    <script src="/static/js/navbar.js"></script>
</body>
</html>
